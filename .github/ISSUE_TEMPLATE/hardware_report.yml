name: 🧪 Hardware report
description: Tell us how ThermoPilot works on your Mac (the most useful contribution right now!)
title: "[Hardware] <Mac model> — <chip>"
labels: ["hardware report"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping support more Macs! 🙏
  - type: input
    id: model
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Air 13\" M2, Mac mini M4 Pro…"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Temperatures look right
        - label: Fan speeds are shown (skip if your Mac has no fan)
        - label: Fan control works (root helper installed)
        - label: Battery info and health look right
        - label: Charge limiter works
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything wrong, missing or surprising?
  - type: textarea
    id: dump
    attributes:
      label: SMC dump
      description: "Attach the output of `/Applications/ThermoPilot.app/Contents/MacOS/fanengine dump > smc-dump.txt` (drag the file here)."
